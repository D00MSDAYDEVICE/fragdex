{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Account</h1><p>Signed in as <strong>{{ user.username }}</strong> ({{ user.role }}).</p></div></div>
<section class="panel" style="max-width:460px">
  <div class="panel-head"><h2>Change password</h2></div>
  <div class="panel-body">
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field"><label for="c">Current password</label><input id="c" type="password" name="current" required autocomplete="current-password"></div>
      <div class="field" style="margin-top:12px"><label for="n">New password (min 10 characters)</label><input id="n" type="password" name="new" required minlength="10" autocomplete="new-password"></div>
      <div class="field" style="margin-top:12px"><label for="r">Repeat new password</label><input id="r" type="password" name="confirm" required minlength="10" autocomplete="new-password"></div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">Change password</button></div>
    </form>
  </div>
</section>
{% endblock %}
