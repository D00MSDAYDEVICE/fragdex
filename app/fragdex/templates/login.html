{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="login-wrap">
  <form class="panel login-card" method="post" action="/login">
    <div class="brand">
      <span class="brand-mark"><svg class="i"><use href="#i-crosshair"/></svg></span>
      <span class="brand-text"><span class="brand-name">Fragdex</span><small>Quake Live player index</small></span>
    </div>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label for="u">Username</label><input id="u" type="text" name="username" value="{{ username or '' }}" autocomplete="username" autofocus required></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
