{% extends "base.html" %}
{% block title %}Tags{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Tags</h1><p>Label players (e.g. banned, cheater, friend, regular) and filter the list by tag.</p></div>
</div>
<section class="panel" style="max-width:760px">
  <div class="panel-body">
    <form method="post" action="/tags" style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="text" name="name" placeholder="New tag name" maxlength="40" required style="flex:1;min-width:180px">
      <input type="color" name="color" value="#e8562a" aria-label="Colour">
      <button class="btn btn-primary" type="submit"><svg class="i"><use href="#i-plus"/></svg>Add tag</button>
    </form>
  </div>
  <table class="dtable">
    <thead><tr><th>Tag</th><th class="num">Players</th><th>Edit</th><th></th></tr></thead>
    <tbody>
    {% for t in tags %}
      <tr>
        <td><a href="/?tag={{ t.id }}"><span class="tag" style="--tag: {{ t.color }}">{{ t.name }}</span></a></td>
        <td class="num">{{ t.n }}</td>
        <td>
          <form method="post" action="/tags/{{ t.id }}" style="display:flex;gap:6px;align-items:center">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <input type="text" name="name" value="{{ t.name }}" maxlength="40" style="width:160px;height:30px">
            <input type="color" name="color" value="{{ t.color }}" aria-label="Colour">
            <button class="btn btn-sm" type="submit">Save</button>
          </form>
        </td>
        <td class="num">
          <form class="inline" method="post" action="/tags/{{ t.id }}/delete" data-confirm="Delete tag '{{ t.name }}'? It will be removed from {{ t.n }} player(s).">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="icon-btn" type="submit" title="Delete tag"><svg class="i"><use href="#i-trash"/></svg></button>
          </form>
        </td>
      </tr>
    {% else %}
      <tr><td colspan="4" class="muted" style="padding:20px 14px">No tags yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
